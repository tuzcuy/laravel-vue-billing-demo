services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: billing
      DB_USERNAME: billing
      DB_PASSWORD: billing   # local demo credentials only
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: billing
      MYSQL_USER: billing
      MYSQL_PASSWORD: billing          # local demo credentials only
      MYSQL_ROOT_PASSWORD: billing-root
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 3s
      timeout: 3s
      retries: 15
    volumes:
      - db-data:/var/lib/mysql

volumes:
  db-data:
